  <line x1="24" y1="14" x2="14" y2="24" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="24" y1="14" x2="34" y2="24" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="14" y1="24" x2="24" y2="34" stroke="white" stroke-width="2" opacity="0.8"/>
  <line x1="34" y1="24" x2="24" y2="34" stroke="white" stroke-width="2" opacity="0.8"/>
  <!-- Center dot -->
