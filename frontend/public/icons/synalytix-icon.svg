  </defs>
  <!-- Main circle -->
  <circle cx="24" cy="24" r="22" fill="url(#icon-gradient)"/>
  <!-- Connected nodes representing data/analytics -->
  <circle cx="24" cy="14" r="3.5" fill="white"/>
  <circle cx="14" cy="24" r="3.5" fill="white"/>
  <circle cx="34" cy="24" r="3.5" fill="white"/>
  <circle cx="24" cy="34" r="3.5" fill="white"/>
