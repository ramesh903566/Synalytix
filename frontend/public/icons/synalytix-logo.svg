<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Icon: Abstract analytics symbol with connected nodes -->
  <g transform="translate(4, 4)">
    <!-- Main circle -->
    <circle cx="20" cy="20" r="18" fill="url(#logo-gradient)"/>
    <!-- Connected nodes representing data/analytics -->
    <circle cx="20" cy="12" r="3" fill="white"/>
    <circle cx="12" cy="20" r="3" fill="white"/>
    <circle cx="28" cy="20" r="3" fill="white"/>
    <circle cx="20" cy="28" r="3" fill="white"/>
    <!-- Connecting lines -->
    <line x1="20" y1="12" x2="12" y2="20" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="20" y1="12" x2="28" y2="20" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="20" x2="20" y2="28" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="28" y1="20" x2="20" y2="28" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="white"/>
  </g>
  <!-- Text -->
  <text x="52" y="32" font-family="Calistoga, serif" font-size="28" font-weight="400" fill="#0F172A">Synalytix</text>
</svg>
